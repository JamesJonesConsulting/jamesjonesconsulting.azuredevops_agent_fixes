---
- name: Setup Podman socket permissions
  ansible.builtin.include_role:
    name: jamesjonesconsulting.podman_socket_group_permissions.permissions_setup
  vars:
    podman_user_group: "{{ vsts_agent_podman_group }}"
    podman_users:
      - "{{ agent.username }}"
- name: Set the agent working directory
  ansible.builtin.set_fact:
    agent_setup_working_dir: "{{ vsts_agent_base_folder }}/{{ agent.folder }}"
- name: Create directory for the agent
  ansible.builtin.file:
    path: "{{ agent_setup_working_dir }}"
    state: directory
    owner: "{{ agent.username }}"
    group: "{{ agent.username }}"
    mode: "0755"
- name: Unarchive latest agent tar.gz file that needs to be downloaded
  ansible.builtin.unarchive:
    src: "https://download.agent.dev.azure.com/agent/{{ agent_setup_version }}/vsts-agent-linux-x64-{{ agent_setup_version }}.tar.gz"
    dest: "{{ agent_setup_working_dir }}"
    owner: "{{ agent.username }}"
    group: "{{ agent.username }}"
    remote_src: true
- name: Configure the install of the vsts agent
  ansible.builtin.command: "./config.sh {{ opts | join(' ') }}"
  become: true
  become_user: "{{ agent.username }}"
  environment: "{{ vsts_agent_environment }}"
  changed_when: true
  vars:
    opts:
      - "--unattended"
      - "--acceptTeeEula"
      - "--agent {{ agent.folder | basename }}"
      - "--url {{ vsts_agent_url }}"
      - "--auth PAT"
      - "--token {{ vsts_agent_registration_token }}"
      - "--pool {{ agent.pool }}"
      - "--replace"
      - "--work {{ agent_setup_working_dir }}"
  args:
    chdir: "{{ agent_setup_working_dir }}"
- name: Update the environment file
  community.general.ini_file:
    path: "{{ agent_setup_working_dir }}/.env"
    option: "{{ cnf.key }}"
    value: "{{ cnf.value }}"
    section: null
    no_extra_spaces: true
    mode: "0644"
  loop: "{{ vsts_agent_environment | dict2items }}"
  loop_control:
    loop_var: cnf
- name: Install the service
  ansible.builtin.command: "./svc.sh {{ cmd }}"
  changed_when: true
  loop:
    - install
  loop_control:
    loop_var: cmd
  args:
    chdir: "{{ agent_setup_working_dir }}"
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
- name: Populate service facts
  ansible.builtin.service_facts:
- name: Match services running from that folder
  ansible.builtin.shell: |
    set -o pipefail
    cat $(systemctl show -P FragmentPath {{ svc }}) | grep ExecStart | cut -f 2 -d '=' | head -n 1 | xargs dirname
  changed_when: true
  loop: "{{ ansible_facts.services.keys() | select('search', '^vsts') | list }}"
  loop_control:
    loop_var: svc
  register: agent_setup_service_home_folders
- name: Handling the agent systemd overlay
  vars:
    agent_setup_systemd_service_name: >-
      {{ agent_setup_service_home_folders.results | selectattr('stdout', 'equalto', agent_setup_working_dir) |
      map(attribute='svc') | flatten | list | first }}"
  block:
    - name: Ensure Azure DevOps agent overlay directory exists
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ agent_setup_systemd_service_name }}.d"
        state: directory
        mode: "0755"
    - name: Add Azure DevOps agent overlay to pick up environment variables
      ansible.builtin.template:
        src: templates/overlay.conf.j2
        dest: "/etc/systemd/system/{{ agent_setup_systemd_service_name }}.d/overlay.conf"
        mode: "0644"
    - name: Perform a daemon-reload to pick up all the new overlays
      ansible.builtin.systemd:
        daemon_reload: true
- name: Start the service
  ansible.builtin.command: "./svc.sh {{ cmd }}"
  changed_when: true
  loop:
    - start
  loop_control:
    loop_var: cmd
  args:
    chdir: "{{ agent_setup_working_dir }}"
